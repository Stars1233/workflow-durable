version: 2

updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    # Keep this on the repository default branch: GitHub does not apply an
    # ecosystem block's options to security updates when target-branch is set.
    # This entry customizes security updates only; do not enable unrelated
    # version-update pull requests as a side effect.
    open-pull-requests-limit: 0
    versioning-strategy: increase-if-necessary
    ignore:
      # Laravel is supplied and locked by each host application. Dependabot
      # cannot safely infer one installed version from this library's
      # multi-major range, so the per-major Composer audit owns this package.
      - dependency-name: laravel/framework
