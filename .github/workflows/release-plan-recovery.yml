name: Release plan recovery

run-name: Recover Workflow from ${{ inputs.plan_tag || 'latest public release plan' }}

on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
    inputs:
      plan_tag:
        description: Immutable release-plan tag; empty selects the newest public plan
        required: false
        type: string
        default: ''

permissions:
  attestations: read
  contents: read

concurrency:
  group: release-plan-recovery-workflow-${{ inputs.plan_tag || 'latest' }}
  cancel-in-progress: false

jobs:
  discover:
    name: Discover exact Workflow release
    if: github.ref == 'refs/heads/v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: read
      contents: read
    outputs:
      action: ${{ steps.recovery.outputs.action }}
      artifact-digest: ${{ steps.privileged-handoff.outputs.artifact-digest }}
      artifact-id: ${{ steps.privileged-handoff.outputs.artifact-id }}
      plan: ${{ steps.recovery.outputs.plan }}
      plan_tag: ${{ steps.recovery.outputs.plan_tag }}
      plan-record-commit: ${{ steps.recovery.outputs.plan_record_commit }}
      source-run-attempt: ${{ github.run_attempt }}
      source-run-id: ${{ github.run_id }}
      version: ${{ steps.recovery.outputs.version }}
      commit: ${{ steps.recovery.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Discover plan and verify release authority
        id: recovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_PLAN_TAG: ${{ inputs.plan_tag }}
        run: |
          arguments=(
            resolve
            --component workflow
            --plan-output release-plan.json
            --preparation-output release-preparation.json
            --evidence release-recovery-evidence.json
            --github-output "$GITHUB_OUTPUT"
          )
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            arguments+=(--allow-empty)
          elif [ -n "$REQUESTED_PLAN_TAG" ]; then
            arguments+=(--plan-tag "$REQUESTED_PLAN_TAG")
          fi
          python scripts/ci/component-release-recovery.py "${arguments[@]}"

      - name: Retain discovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: workflow-release-recovery-discovery-${{ steps.recovery.outputs.plan || github.run_id }}
          path: |
            release-plan.json
            release-preparation.json
            release-recovery-evidence.json
          if-no-files-found: warn

      - name: Package the privileged publication handoff as one immutable file
        if: steps.recovery.outputs.action == 'publish'
        run: |
          handoff=(
            release-plan.json
            release-preparation.json
            release-recovery-evidence.json
          )
          for file in "${handoff[@]}"; do
            if [ ! -f "$file" ]; then
              printf 'release recovery handoff is missing %s\n' "$file" >&2
              exit 1
            fi
          done
          tar -cf release-recovery-handoff.tar "${handoff[@]}"

      - name: Bind the privileged publication handoff identity and digest
        if: steps.recovery.outputs.action == 'publish'
        id: privileged-handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          archive: false
          if-no-files-found: error
          path: release-recovery-handoff.tar

  publish:
    name: Publish exact Workflow release
    needs: discover
    if: >-
      github.ref == 'refs/heads/v2' &&
      needs.discover.outputs.action == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: packagist
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Restore the immutable release plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          artifact-ids: ${{ needs.discover.outputs.artifact-id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          path: isolated-release-recovery
          repository: ${{ github.repository }}
          run-id: ${{ needs.discover.outputs.source-run-id }}

      - name: Validate the exact producer artifact before use
        env:
          ARTIFACT_DIRECTORY: isolated-release-recovery
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.discover.outputs.artifact-digest }}
          EXPECTED_ARTIFACT_ID: ${{ needs.discover.outputs.artifact-id }}
          EXPECTED_SOURCE_RUN_ATTEMPT: ${{ needs.discover.outputs.source-run-attempt }}
          EXPECTED_SOURCE_RUN_ID: ${{ needs.discover.outputs.source-run-id }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            printf 'producer artifact digest is not an exact SHA-256 digest\n' >&2
            exit 1
          fi
          for identity in "$EXPECTED_ARTIFACT_ID" "$EXPECTED_SOURCE_RUN_ID" "$EXPECTED_SOURCE_RUN_ATTEMPT"; do
            if [[ ! "$identity" =~ ^[1-9][0-9]*$ ]]; then
              printf 'producer artifact identity is invalid\n' >&2
              exit 1
            fi
          done
          if [[ ! "$ARTIFACT_DIRECTORY" =~ ^isolated-[a-z0-9][a-z0-9._-]*$ ]]; then
            printf 'artifact validation directory is unsafe\n' >&2
            exit 1
          fi
          mapfile -d '' entries < <(
            /usr/bin/find "$ARTIFACT_DIRECTORY" -mindepth 1 -maxdepth 1 -print0
          )
          if [ "${#entries[@]}" -ne 1 ] || [ ! -f "${entries[0]}" ] || [ -L "${entries[0]}" ]; then
            printf 'artifact handoff must contain exactly one regular file\n' >&2
            exit 1
          fi
          observed_digest="$(/usr/bin/sha256sum "${entries[0]}")"
          observed_digest="${observed_digest%% *}"
          if [ "$observed_digest" != "$EXPECTED_ARTIFACT_DIGEST" ]; then
            printf 'artifact digest mismatch: expected %s, got %s\n' \
              "$EXPECTED_ARTIFACT_DIGEST" "$observed_digest" >&2
            exit 1
          fi
          printf 'validated artifact %s from run %s attempt %s\n' \
            "$EXPECTED_ARTIFACT_ID" "$EXPECTED_SOURCE_RUN_ID" "$EXPECTED_SOURCE_RUN_ATTEMPT"

      - name: Extract the validated release recovery handoff
        run: |
          mkdir recovery-input
          tar -xf isolated-release-recovery/release-recovery-handoff.tar -C recovery-input

      - name: Revalidate exact lifecycle authority at the publication boundary
        id: publication-authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLAN_RECORD_COMMIT: ${{ needs.discover.outputs.plan-record-commit }}
          PLAN_TAG: ${{ needs.discover.outputs.plan_tag }}
        run: |
          python scripts/ci/component-release-recovery.py authorize-publication \
            --component workflow \
            --plan-tag "$PLAN_TAG" \
            --plan-record-commit "$PLAN_RECORD_COMMIT" \
            --plan recovery-input/release-plan.json \
            --preparation recovery-input/release-preparation.json \
            --evidence publication-authority-evidence.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Create the exact source tag
        if: steps.publication-authority.outputs.action == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.publication-authority.outputs.version }}
          RELEASE_COMMIT: ${{ steps.publication-authority.outputs.commit }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" -f sha="$RELEASE_COMMIT" >/dev/null
          fi

      - name: Wait for Packagist source identity
        if: steps.publication-authority.outputs.action == 'publish'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/ci/component-release-recovery.py verify \
            --component workflow --plan recovery-input/release-plan.json --registry-only \
            --attempts 30 --sleep 20 --evidence registry-publication-evidence.json

      - name: Create the source GitHub Release
        if: steps.publication-authority.outputs.action == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.publication-authority.outputs.version }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --prerelease --generate-notes \
              --title "$RELEASE_TAG"
          fi

      - name: Verify completed public release
        if: >-
          steps.publication-authority.outputs.action == 'publish' ||
          steps.publication-authority.outputs.action == 'verify'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/ci/component-release-recovery.py verify \
            --component workflow --plan recovery-input/release-plan.json \
            --attempts 3 --sleep 5 --evidence release-completion-evidence.json

      - name: Retain publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: workflow-release-recovery-publication-${{ needs.discover.outputs.plan || github.run_id }}
          path: |
            recovery-input/release-plan.json
            recovery-input/release-preparation.json
            recovery-input/release-recovery-evidence.json
            publication-authority-evidence.json
            registry-publication-evidence.json
            release-completion-evidence.json
          if-no-files-found: warn
